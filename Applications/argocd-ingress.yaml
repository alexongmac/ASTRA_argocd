apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astra-argocd
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.kubernetes.io/hostname: astra-argocd.sctp-sandbox.com
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - astra-argocd.sctp-sandbox.com
      secretName: astra-argocd-tls
  rules:
    - host: astra-argocd.sctp-sandbox.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
