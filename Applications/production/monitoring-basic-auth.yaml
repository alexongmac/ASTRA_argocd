# Password protection for the Prometheus and Alertmanager web pages.
# The username/password live in the Secret "monitoring-basic-auth"
# (created by hand with kubectl, never stored in Git).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: monitoring
spec:
  basicAuth:
    secret: monitoring-basic-auth
    removeHeader: true
