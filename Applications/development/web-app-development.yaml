apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-app-development
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: astra
  source:
    # Raw manifests, not a Helm chart - this is our own app's image, not a
    # published chart, so there's no chart repo to point at like the other
    # Applications in this project.
    repoURL: https://github.com/alexongmac/ASTRA_argocd.git
    targetRevision: develop
    path: envs/development/web-app
  destination:
    server: https://kubernetes.default.svc
    namespace: web-app
  ignoreDifferences:
    # replicas is managed by the HPA (envs/development/web-app/hpa.yaml) once
    # it scales out, so don't let selfHeal fight it back down to the Git value.
    - group: apps
      kind: Deployment
      name: astra-web-app
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
