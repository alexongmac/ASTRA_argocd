apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: astra
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.15.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        serviceAccount:
          # The Terraform aws_eks_pod_identity_association (26-external-secrets.tf)
          # binds the IAM role to this exact namespace + service account name.
          create: true
          name: external-secrets
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  ignoreDifferences:
    # The cert controller injects its CA bundle into the CRD conversion config
    # and the validating webhooks after install; without this, selfHeal keeps
    # reverting it and the app flaps between OutOfSync and Synced.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The ExternalSecret/SecretStore CRDs are large enough to exceed the
      # annotation size limit of client-side apply.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 4
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
