# argocd-cm is deliberately NOT declared here. Do not add it back.
#
# This file holds only argocd-rbac-cm, which nothing else templates.
#
# History, because both obvious options were tried and both failed:
#
#   1. Declaring a one-key argocd-cm here while the Helm chart templated the
#      same object with ~19 keys. ArgoCD applies git as the whole object, so
#      it reduced the live ConfigMap to that single key and discarded
#      resource.exclusions and every
#      resource.customizations.ignoreResourceUpdates.* with it. The cluster
#      stayed up but the application-controller then watched Kyverno reports,
#      Leases and EndpointSlices cluster-wide. (development, 2026-11-21)
#
#   2. Deleting it from git while nothing else owned it. The parent
#      astra-root-ENV app syncs with prune: true, so ArgoCD deleted the
#      ConfigMap outright. The controller logged "configmap argocd-cm not
#      found", lost its comparison settings, and all 11 Applications went
#      Sync=Unknown / Health=Unknown with "Skipping auto-sync: application
#      status is Unknown". GitOps stopped until it was restored by hand.
#      (development, 2026-11-20)
#
# What works is a single owner that declares the COMPLETE object. That owner
# is bootstrap/argocd-install/, where upstream install.yaml supplies
# resource.exclusions and the ignoreResourceUpdates blocks and
# cm-patch.yaml adds accounts.developer on top. Add new argocd-cm keys
# there, not here.
#
# The policy.csv below still grants role:developer; the account it names is
# created by that cm-patch.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  policy.csv: |
    p, role:developer, applications, get, astra/*, allow
    p, role:developer, applications, create, astra/*, allow
    p, role:developer, applications, update, astra/*, allow
    p, role:developer, applications, delete, astra/*, allow
    p, role:developer, applications, sync, astra/*, allow
    p, role:developer, applications, action/*, astra/*, allow
    p, role:developer, logs, get, astra/*, allow
    p, role:developer, exec, create, astra/*, allow
    p, role:developer, projects, get, astra, allow
    p, role:developer, repositories, get, *, allow
    p, role:developer, clusters, get, *, allow
    g, developer, role:developer
  policy.default: ""
