# DO NOT remove argocd-cm from this file.
#
# It looks wrong: the ArgoCD Helm chart templates argocd-cm itself with ~19
# keys (resource.exclusions, every
# resource.customizations.ignoreResourceUpdates.*, application.instanceLabelKey,
# exec.enabled, the timeout.* set), while this declares only one. Two owners
# for one object, with git holding a strict subset.
#
# But deleting it from git is far worse than the mismatch. The parent
# astra-root-ENV app syncs with prune: true, so removing this block makes
# ArgoCD DELETE the whole ConfigMap - including the chart's 18 other keys.
# That was tried on development on 2026-11-20 and took the cluster down:
# the application-controller logs "configmap argocd-cm not found", loses its
# comparison settings, and every Application in the cluster goes
# Sync=Unknown / Health=Unknown with "Skipping auto-sync: application status
# is Unknown". GitOps stops entirely until the ConfigMap is restored by hand
# from `helm template argo-cd --version <chart>`.
#
# The subset is safe in practice because ArgoCD applies server-side: it only
# claims the field it declares here and leaves the chart's keys alone. Keep
# this block, and if you need another key, ADD it here rather than removing
# the resource.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  # The local account that policy.csv below grants role:developer to.
  accounts.developer: apiKey, login
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  policy.csv: |
    p, role:developer, applications, get, astra/*, allow
    p, role:developer, applications, create, astra/*, allow
    p, role:developer, applications, update, astra/*, allow
    p, role:developer, applications, delete, astra/*, allow
    p, role:developer, applications, sync, astra/*, allow
    p, role:developer, applications, action/*, astra/*, allow
    p, role:developer, logs, get, astra/*, allow
    p, role:developer, exec, create, astra/*, allow
    p, role:developer, projects, get, astra, allow
    p, role:developer, repositories, get, *, allow
    p, role:developer, clusters, get, *, allow
    g, developer, role:developer
  policy.default: ""
