apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  # See Applications/kube-prometheus-stack.yaml: a declared label stops
  # ArgoCD's stripped tracking label leaving "labels: null" and reporting
  # false drift.
  labels:
    app.kubernetes.io/part-of: astra
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: alexongmac@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: Z00541411T1NGPV97B5C0
