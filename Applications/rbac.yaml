# Custom RBAC roles for teammates whose IAM access entry (11-teamaccess.tf)
# maps them into one of the kubernetes_groups bound below, instead of an AWS
# managed cluster-access-policy. Apply with: kubectl apply -f rbac.yaml
#
# admin -> alexongmac uses the AWS managed AmazonEKSClusterAdminPolicy
# directly (11-teamaccess.tf), which is equivalent to Kubernetes' built-in
# cluster-admin ClusterRole, so no custom role is defined for it here.

# developer: manage workloads cluster-wide, including what a
# `helm install/upgrade` needs to create (secrets, serviceaccounts, pvcs,
# and namespace-scoped RBAC that charts ship for their own pods), plus
# creating namespaces themselves - no access to ResourceQuotas or
# cluster-scoped RBAC beyond roles/rolebindings.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: developer
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources:
      - pods
      - pods/log
      - pods/exec
      - services
      - configmaps
      - serviceaccounts
      - persistentvolumeclaims
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
      - jobs
      - cronjobs
      - ingresses
      - endpoints
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # secrets: no get/list - that would let anyone read astra-web-app's
  # DATABASE_URL (astradb credentials) back out of the cluster. Charts can
  # still create/update/delete their own secrets during install/upgrade.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch"]
  # read-only: developers can check node capacity/scheduling but shouldn't
  # cordon/drain/delete nodes themselves.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # kubectl top nodes/pods
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  # ArgoCD Applications/ApplicationSets, so developers can view and sync
  # their own app's deployment status via kubectl or the ArgoCD UI/CLI.
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # read-only: Trivy scan results (vulnerabilities, misconfig, secrets, SBOM)
  # so developers can see findings against their own workloads.
  - apiGroups: ["aquasecurity.github.io"]
    resources:
      - vulnerabilityreports
      - clustervulnerabilityreports
      - configauditreports
      - clusterconfigauditreports
      - exposedsecretreports
      - sbomreports
      - clustersbomreports
      - rbacassessmentreports
      - clusterrbacassessmentreports
      - infraassessmentreports
      - clusterinfraassessmentreports
      - clustercompliancereports
    verbs: ["get", "list", "watch"]
  # read-only: Kyverno policy definitions and their PolicyReport results, so
  # developers can see why a resource failed a policy, without being able to
  # change the policies themselves.
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies", "policies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports", "clusterpolicyreports"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding (not namespaced RoleBindings) since namespaces are
# cluster-scoped and developer is now granted cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eks-developers-binding
subjects:
  - kind: Group
    name: eks-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: developer
  apiGroup: rbac.authorization.k8s.io

---
# sre: read-only. Cluster-wide read on everything except secrets (pods, nodes,
# services and the rest), plus pod logs. No exec, no delete, no create, update
# or patch of anything: an SRE can look at the cluster but not change it.
# Changes go through a developer or the cluster admin.
#
# Secrets are left out on purpose. They live in the core ("") group, which the
# wildcard below does not cover, and only the cluster-admin identity
# (AmazonEKSClusterAdminPolicy -> system:masters) can read the astra-web-app
# Secret that holds the RDS astradb credentials.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre
rules:
  # Everything outside the core ("") API group, read-only.
  - apiGroups: ["apps", "batch", "networking.k8s.io", "metrics.k8s.io", "argoproj.io", "aquasecurity.github.io", "kyverno.io", "wgpolicyk8s.io", "rbac.authorization.k8s.io", "autoscaling", "policy", "storage.k8s.io", "coordination.k8s.io", "discovery.k8s.io", "node.k8s.io", "scheduling.k8s.io", "apiextensions.k8s.io", "admissionregistration.k8s.io", "cert-manager.io", "acme.cert-manager.io", "traefik.io", "monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Core API group, read-only, everything except secrets.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - serviceaccounts
      - persistentvolumeclaims
      - persistentvolumes
      - endpoints
      - events
      - namespaces
      - nodes
      - replicationcontrollers
      - resourcequotas
      - limitranges
      - componentstatuses
      - podtemplates
    verbs: ["get", "list", "watch"]
---
# Unchanged from before: same name, same role reference (sre), so it applies in
# place. Only the sre role's rules above got narrower.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eks-sres-binding
subjects:
  - kind: Group
    name: eks-sres
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: sre
  apiGroup: rbac.authorization.k8s.io
