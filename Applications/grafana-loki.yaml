apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: astra
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.5.0
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: SingleBinary

        serviceAccount:
          create: true
          name: loki
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::255945442255:role/astra-eks-development-loki-role

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage:
            type: s3
            bucketNames:
              chunks: astra-eks-development-loki-logs
              ruler: astra-eks-development-loki-logs
              admin: astra-eks-development-loki-logs
            s3:
              region: us-east-1
              s3ForcePathStyle: false

        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            storageClass: gp2
            size: 10Gi
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi }

        # kiwigrid/k8s-sidecar watches for ConfigMap-based rules and reloads them -
        # defaults to {} (no limits) upstream, flagged by Kyverno's
        # require-resource-limits policy. 64Mi OOMKilled it on startup - needs more
        # headroom than steady-state usage suggests.
        sidecar:
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }

        # SingleBinary mode doesn't use the read/write/backend split - disable them
        # so the chart doesn't also deploy the SimpleScalable components.
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0

        gateway:
          enabled: false

        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        test:
          enabled: false

        monitoring:
          serviceMonitor:
            enabled: false
          selfMonitoring:
            enabled: false

        lokiCanary:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
