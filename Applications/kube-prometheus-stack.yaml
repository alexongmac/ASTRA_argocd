apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  # Without a label declared here, this resource's only label is the
  # argocd.argoproj.io/instance tracking label ArgoCD adds itself (the key
  # named by application.instanceLabelKey in argocd-cm). ArgoCD strips that
  # label from the desired manifest before diffing, which left an empty map
  # serialising as "labels: null" - never equal to the live object's absent
  # key. The parent astra-root-ENV app therefore reported this permanently
  # OutOfSync even though a sync succeeded and changed nothing.
  labels:
    app.kubernetes.io/part-of: astra
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: astra
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.2.2 # example only; pin the version currently deployed
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        grafana:
          # 256Mi OOMKilled Grafana 13.x on startup (search-index build etc.) -
          # needs more headroom than steady-state usage suggests.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 512Mi
          sidecar:
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              isDefault: false
        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # config-reloader sidecar the operator injects into both the
          # Prometheus and Alertmanager pods it manages.
          prometheusConfigReloader:
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
        prometheus:
          prometheusSpec:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
        alertmanager:
          # Mount the Discord webhook URL from a secret created out-of-band
          # (kubectl create secret generic alertmanager-discord -n monitoring
          # --from-literal=webhook-url=...). Keeping it out of git means this
          # file stays safe to commit; the tradeoff is that the secret must be
          # recreated by hand if the namespace is ever rebuilt.
          alertmanagerSpec:
            replicas: 2
            resources:
              requests:
                cpu: 20m
                memory: 200Mi
              limits:
                cpu: 100m
                memory: 256Mi
            secrets:
              - alertmanager-discord
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ["alertname", "namespace"]
              group_wait: 30s
              group_interval: 5m
              # 4h rather than the chart's 12h: long enough not to spam, short
              # enough that a still-firing problem resurfaces within a workday.
              repeat_interval: 4h
              receiver: discord
              routes:
                # Watchdog fires constantly by design - it is the deadman switch
                # proving the alert pipeline works. Routing it to Discord would
                # post every repeat_interval forever.
                - matchers:
                    - alertname = "Watchdog"
                  receiver: "null"
                # EKS runs the control plane as a managed service, so these
                # components are not scrapeable from inside the cluster and
                # Prometheus permanently reports them down. They are false
                # positives on every EKS cluster, not a real outage.
                - matchers:
                    - alertname =~ "KubeControllerManagerDown|KubeSchedulerDown|KubeProxyDown"
                  receiver: "null"
                - matchers:
                    - severity = "critical"
                  receiver: discord-critical
            receivers:
              - name: "null"
              - name: discord
                discord_configs:
                  - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
                    send_resolved: true
                    title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
                    message: |-
                      {{ range .Alerts }}**{{ .Labels.severity }}** · `{{ .Labels.namespace }}{{ if .Labels.pod }}/{{ .Labels.pod }}{{ end }}`
                      {{ .Annotations.summary }}
                      {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
                      {{ end }}
              - name: discord-critical
                discord_configs:
                  - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
                    send_resolved: true
                    title: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} [CRITICAL] {{ .CommonLabels.alertname }}'
                    message: |-
                      {{ range .Alerts }}**{{ .Labels.severity }}** · `{{ .Labels.namespace }}{{ if .Labels.pod }}/{{ .Labels.pod }}{{ end }}`
                      {{ .Annotations.summary }}
                      {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
                      {{ end }}
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        kube-state-metrics:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
        # --reuse-values: add every other value from your existing release here
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
