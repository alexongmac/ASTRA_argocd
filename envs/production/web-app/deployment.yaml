apiVersion: apps/v1
kind: Deployment
metadata:
  name: astra-web-app
  namespace: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: astra-web-app
  template:
    metadata:
      labels:
        app: astra-web-app
    spec:
      serviceAccountName: astra-web-app
      containers:
        - name: astra-web-app
          # Replaced by web-app-deploy.yml on every push to app/**
          image: 255945442255.dkr.ecr.us-east-1.amazonaws.com/astra-eks-production-app:0da403cb56074c18205fbdcc37f95f888d6e6915
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: astra-web-app
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: astra-web-app
                  key: AUTH_SECRET
            - name: AUTH_TRUST_HOST
              value: "true"
            # AUTH_TRUST_HOST alone makes NextAuth derive redirect URLs from the
            # request's host headers, but the ALB forwards to the pod without
            # X-Forwarded-Host, so it fell back to the container's bind address
            # and sign-in redirected the browser to https://0.0.0.0:3000/login.
            # Stating the public URL explicitly is what fixes that.
            - name: AUTH_URL
              value: "https://astra-app-prod.sctp-sandbox.com"
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
---
# The SQS consumer runs from the same image under a different command, so it
# always ships in lockstep with the web tier.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astra-web-app-worker
  namespace: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: astra-web-app-worker
  template:
    metadata:
      labels:
        app: astra-web-app-worker
    spec:
      serviceAccountName: astra-web-app
      containers:
        - name: worker
          image: 255945442255.dkr.ecr.us-east-1.amazonaws.com/astra-eks-production-app:0da403cb56074c18205fbdcc37f95f888d6e6915
          command: ["node", "dist/worker.cjs"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: astra-web-app
                  key: DATABASE_URL
            - name: SQS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: astra-web-app
                  key: SQS_QUEUE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
