# Keeps the database connection string in step with the RDS-managed master
# password. RDS rotates that password in Secrets Manager every 7 days; this
# rebuilds DATABASE_URL from it, and Reloader restarts the pods that use it.
#
# AUTH_SECRET and SQS_QUEUE_URL are not in the RDS secret, so they stay in the
# hand-made astra-web-app Secret. Only DATABASE_URL comes from here.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: web-app
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # No auth block on purpose: the operator uses its own EKS Pod Identity
      # role (26-external-secrets.tf), which can read only the RDS secret.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: astra-db-credentials
  namespace: web-app
spec:
  # Rotation changes the password in place (the old one stops working at once),
  # so this is the window in which new database connections can fail. Five
  # minutes costs a few cents a month in Secrets Manager API calls.
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: astra-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # urlquery escapes characters such as @ : / in the generated password.
        DATABASE_URL: "mysql://{{ .username }}:{{ .password | urlquery }}@astra-mysql-db.chheppac9ozc.us-east-1.rds.amazonaws.com:3306/astradb"
  dataFrom:
    - extract:
        # The secret RDS created for astra-mysql-db (manage_master_user_password).
        # The ARN changes if the database instance is ever recreated.
        key: arn:aws:secretsmanager:us-east-1:255945442255:secret:rds!db-f1d28282-b09e-46e9-89c4-b726c5f4317e-hEfyEo
