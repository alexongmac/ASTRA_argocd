# Builds the app's database connection string from the least-privilege
# astra_app login in Secrets Manager, and keeps the Kubernetes Secret in step
# with it. Reloader restarts the pods that use it when it changes.
#
# AUTH_SECRET and SQS_QUEUE_URL are not part of that login, so they stay in the
# hand-made astra-web-app Secret. Only DATABASE_URL comes from here.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: web-app
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # No auth block on purpose: the operator uses its own EKS Pod Identity
      # role (26-external-secrets.tf), which can read only the RDS secret.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: astra-db-credentials
  namespace: web-app
spec:
  # Rotation changes the password in place (the old one stops working at once),
  # so this is the window in which new database connections can fail. Five
  # minutes costs a few cents a month in Secrets Manager API calls.
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: astra-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # urlquery escapes characters such as @ : / in the generated password.
        DATABASE_URL: "mysql://{{ .username }}:{{ .password | urlquery }}@astra-mysql-db.chheppac9ozc.us-east-1.rds.amazonaws.com:3306/astradb"
  dataFrom:
    - extract:
        # The astra_app login: a MySQL user that can only SELECT, INSERT, UPDATE
        # and DELETE rows in astradb. Created and stored by
        # scripts/create-db-app-user.sh (28-db-app-user.tf makes the secret).
        # It is not rotated automatically: re-run that script to rotate it.
        #
        # To roll back to the RDS master login (rotated every 7 days by RDS),
        # point this at the secret RDS created for astra-mysql-db instead:
        #   arn:aws:secretsmanager:us-east-1:255945442255:secret:rds!db-f1d28282-b09e-46e9-89c4-b726c5f4317e-hEfyEo
        key: astra-eks-development-db-app-credentials
