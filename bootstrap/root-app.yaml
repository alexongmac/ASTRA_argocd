apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astra-root
  namespace: argocd
spec:
  project: astra
  source:
    repoURL: https://github.com/alexongmac/ASTRA_argocd.git
    targetRevision: main
    path: Applications
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
