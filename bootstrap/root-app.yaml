apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astra-root
  namespace: argocd
  annotations:
    # Client-side diff fails on the child Application CRDs with
    # ".status.observedGeneration: field not declared in schema", blocking
    # comparison entirely. Server-side diff offloads the merge to the API
    # server, which has the correct schema for the field.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: astra
  source:
    repoURL: https://github.com/alexongmac/ASTRA_argocd.git
    targetRevision: main
    path: Applications
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
