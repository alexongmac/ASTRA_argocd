# server.insecure, which used to be a `set` block in 23-argocd.tf.
#
# Traefik terminates TLS in front of argocd-server, so argocd-server must run
# plaintext internally or it 307-redirect-loops every request (it believes
# every request is insecure and keeps redirecting to itself).
#
# THIS IS THE FIX FOR THE argocd-cmd-params-cm OWNERSHIP PROBLEM.
#
# Under Helm, the chart templated argocd-cmd-params-cm with ~21 keys, so a
# patch declared anywhere else was overwritten back on every helm upgrade -
# which is why the old 23-argocd.tf comment said to set it there and not in
# ASTRA_argocd/Applications/.
#
# Upstream install.yaml ships argocd-cmd-params-cm with NO data block at all -
# it is an empty placeholder meant to be filled in. So setting the key here
# gives the ConfigMap a single owner, and Applications/argocd-cmd-params.yaml
# (which declared server.insecure against the Helm-owned 21 keys) can be
# deleted once this is live.
#
# Contrast with argocd-cm, which upstream DOES ship with 11 keys of its own.
# That one keeps its existing arrangement - see the warning in
# Applications/argocd-rbac.yaml about why removing it from git deletes the
# whole ConfigMap and stops GitOps cluster-wide.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
data:
  server.insecure: "true"
