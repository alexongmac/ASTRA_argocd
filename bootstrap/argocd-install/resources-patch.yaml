# Resource requests/limits for every ArgoCD component.
#
# Ported verbatim from the ASTRA repo's 23-argocd.tf locals
# (argocd_default_resources / argocd_controller_resources), which this
# replaces. Upstream install.yaml sets no resources at all, and Kyverno's
# require-resource-limits ClusterPolicy flags every such container.
#
# These are strategic-merge patches: each document names the workload and the
# container, and lists ONLY the fields to change. Everything else - image,
# args, env, volumes, probes - is taken from upstream untouched. That is why
# these few lines can safely modify a 37,000-line input.
#
# CONTAINER NAMES MUST MATCH UPSTREAM, NOT THE HELM CHART. They differ, and
# this is the one thing to get right here:
#
#   workload                          upstream container   Helm chart's
#   argocd-server                      argocd-server         server
#   argocd-repo-server                 argocd-repo-server    repo-server
#   argocd-application-controller      argocd-application-controller
#                                                            application-controller
#   argocd-dex-server                  dex                   dex-server
#   argocd-applicationset-controller   argocd-applicationset-controller
#                                                            applicationset-controller
#   argocd-notifications-controller    argocd-notifications-controller
#                                                            notifications-controller
#   argocd-redis                       redis                 redis
#
# Note dex is "dex", not "argocd-dex-server" - it does not follow the pattern.
#
# Getting this wrong does NOT silently no-op. The merge treats the mismatched
# name as a NEW container with no image, and the apply is rejected with
#   spec.template.spec.containers[0].image: Required value
# for every affected workload - which is how it failed on the first real
# migration attempt (2026-11-21), after the names had been read off the
# running Helm-installed cluster instead of upstream install.yaml.
#
# Verify every workload keeps BOTH an image and limits before applying:
#   kubectl kustomize bootstrap/argocd-install/ \
#     | grep -E '^  name: argocd-|image:|memory:'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  template:
    spec:
      containers:
        # The controller tracks live state for every Application across the
        # whole cluster (11 apps here) - it OOMKilled at 512Mi, so it gets a
        # larger ceiling than the shared default below.
        - name: argocd-application-controller
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    spec:
      containers:
        - name: argocd-server
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
        - name: argocd-repo-server
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
spec:
  template:
    spec:
      containers:
        - name: dex
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
