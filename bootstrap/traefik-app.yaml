# Lives in bootstrap/ (applied directly via kubectl), NOT in Applications/
# synced by astra-root. The traefik ingresses in Applications/ reference
# ingressClassName: traefik, and the AWS LB controller's admission webhook
# rejects an ingress whose IngressClass doesn't exist yet - which happens
# during astra-root's server-side-diff comparison, before any sync runs. So
# Traefik (and its IngressClass) must be installed independently and first,
# or it would deadlock its own ingresses' comparison inside the same app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: astra
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.2.0
    helm:
      releaseName: traefik
      valuesObject:
        deployment:
          replicas: 2
        resources:
          requests:
            cpu: 50m
            memory: 90Mi
          limits:
            cpu: 200m
            memory: 180Mi
        service:
          type: LoadBalancer
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: nlb
            service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
        ingressClass:
          enabled: true
          isDefaultClass: true
        providers:
          kubernetesCRD:
            enabled: true
          kubernetesIngress:
            enabled: true
        ingressRoute:
          dashboard:
            enabled: false # keep the dashboard off unless you secure it
        metrics:
          prometheus:
            service:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
